[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "groundgate-lite"
version = "1.0.0"
description = "Open-source hybrid RAG (vector + BM25 + RRF) with a relevance gate that says \"I don't know\" instead of guessing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.6", "pydantic-settings>=2.2", "httpx>=0.27", "numpy>=1.26", "pypdf>=4.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
ggl = "groundgate_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["groundgate_lite"]
